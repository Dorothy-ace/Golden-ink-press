<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Ink Press</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b101b;
      color: #f8fafc;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 1.25rem;
      background: #0f1626;
      border-bottom: 1px solid #1e293b;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    #menu-toggle {
      background: #161d2e;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.42rem 0.68rem;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.08rem;
      color: #f8fafc;
      text-decoration: none;
      white-space: nowrap;
    }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex-wrap: wrap;
    }
    .header-nav button, .header-nav a {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.93rem;
      cursor: pointer;
      text-decoration: none;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .header-nav button:hover, .header-nav a:hover {
      background: #1e293b;
      color: #fff;
    }
    .auth-pair {
      display: inline-flex;
      align-items: center;
      gap: 1.15rem;
      margin-left: 0.25rem;
    }
    #sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1100;
      display: none;
    }
    #sidebar {
      position: fixed;
      top: 0;
      left: -285px;
      width: 275px;
      height: 100vh;
      background: #111827;
      border-right: 1px solid #2b3854;
      padding: 1rem;
      z-index: 1200;
      transition: left 0.22s ease;
      overflow-y: auto;
    }
    #sidebar.open {
      left: 0;
    }
    #sidebar ul {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .sb-sublist {
      list-style: none;
      padding: 0.2rem 0 0.4rem 0.85rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: #fff;
      border: 1px solid #3b82f6;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      z-index: 9999;
      font-size: 0.9rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <button type="button" id="menu-toggle" aria-label="Open menu">☰</button>
      <a href="#" id="brand-home" class="brand-title">🖋️ Golden Ink Press</a>
    </div>
    <nav class="header-nav">
      <button type="button" id="about-btn">About ▾</button>
      <button type="button" id="contact-btn">Contact</button>
      <span class="auth-pair">
        <button type="button" id="header-login-btn">Log In</button>
        <button type="button" id="header-signup-btn">Sign Up</button>
      </span>
      <a href="#" id="cart-link">Cart (0)</a>
    </nav>
  </header>

  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Golden Ink Press</strong>
      <button type="button" id="sidebar-close" style="background:transparent;border:1px solid #334155;color:#fff;border-radius:6px;padding:0.25rem 0.55rem;cursor:pointer;">✕</button>
    </div>
    <nav>
      <ul id="sidebar-menu"></ul>
    </nav>
  </aside>

  <main></main>
  <div id="toast" class="hidden"></div>

  <script src="script.js"></script>
</body>
</html>
